# Canli Toplanti Cevirmeni ayarlari.
# Bu dosyadaki her deger src/config.py icindeki DEFAULTS ile birlestirilir,
# yani sadece degistirmek istedigin satirlari birakabilirsin.

audio:
  device: auto          # auto = varsayilan hoparlor cikisinin WASAPI loopback'i
  sample_rate: 16000    # Whisper 16 kHz bekler, degistirme

asr:
  model: base.en        # tiny.en (hizli) | base.en (dengeli) | small.en (dogru ama agir)
  # Ara altyazi icin ayri (kucuk) model. Olculdu: cagri basina tiny.en ~0,6 sn,
  # base.en ~1,1 sn. Whisper her cagrida sesi 30 sn'ye doldurdugu icin bu maliyet
  # tampon uzunlugundan bagimsizdir; ara altyazida gecikmeyi belirleyen budur.
  # Bos birakilirsa ara altyazi da ana modeli kullanir (daha yavas, daha dogru).
  partial_model: tiny.en
  compute_type: int8
  cpu_threads: 3        # 4 cekirdekli CPU'da 1 cekirdek Teams'e birakilir
  beam_size: 1          # 1 = greedy, en hizli
  language: en
  # JARGON IPUCU: Whisper'in ozel isimleri/kisaltmalari DOGRU YAZMASI icin.
  # Sadece transkripti etkiler, ceviriyi etkilemez. Virgulle ayrilmis liste
  # ya da normal bir cumle yazabilirsin. 50 kelimeyi gecmemeye calis: Whisper
  # uzun ipuclarini kirpar ve bazen listedeki kelimeleri hic gecmedigi halde
  # uydurur. Ornek (kendi urun/musteri/teknoloji adlarini yaz):
  #
  # initial_prompt: "Salesforce, Apex, LWC, sandbox, Jira, sprint, backlog,
  #   Dragin, Azure DevOps, API, endpoint, payload"
  #
  # Salesforce/IT + MCA (merchant cash advance) toplantilari icin. 24.09
  # toplantisinda "ISO" -> "iPhone", "underwriting" -> "on the writing/riding"
  # olarak yaziliyordu. Bu projede hesap tipi IFO (BF_Account_Type__c = IFO), ISO degil;
  # "iPhone" hatalarinin cogu aslinda "IFO". Ozel isimler (Herman, Andy...) bilerek yok; toplantiya
  # gore eklenebilir.
  initial_prompt: "Salesforce, Apex, LWC, SOQL, governor limits, trigger, sandbox, org, Flow, deployment, Jira, sprint, backlog, API, endpoint, payload. MCA underwriting: IFO, underwriter, merchant, deal, term sheet, syndication, ACH, NSF, DocuSign, funders, stacking, positions, payback, holdback."
  # Halusinasyon filtresi (olculen: gercek konusma -0.07..-0.40, uydurma -1.03..-1.61)
  min_avg_logprob: -0.85
  partial_min_avg_logprob: -0.6   # ara altyazilar icin daha siki esik
  max_no_speech_prob: 0.5
  # Whisper'in kendi VAD'i kendi segmenter'imizin uzerine binince sessiz konusmayi
  # tamamen siliyor (olculdu); bu yuzden kapali, halusinasyonu skor filtresi tutuyor.
  vad_filter: false

segmenter:
  silence_ms: 700       # bu kadar sessizlik = cumle bitti
  min_speech_ms: 400    # daha kisa sesler yok sayilir (tik, bildirim sesi)
  max_segment_s: 8        # uzun monologlarda zorunlu kesme (en sessiz noktadan)
  preroll_ms: 500       # konusma basindaki ilk hecenin kacmamasi icin on tampon
  vad_multiplier: 1.8   # esik = gurultu tabani * bu katsayi
  vad_release_ratio: 0.4   # konusma basladiktan sonra esigin dusurulme orani
  vad_abs_floor: 0.0015 # mutlak alt esik; olculdu: sessiz konusma rms ~0.003
  merge_below_s: 2.0    # bundan kisa parcalar tek basina basilmaz, sonrakine eklenir
  carry_wait_ms: 1200   # devami gelmezse kisa parca bu sure sonra tek basina basilir
  # Ara altyazi: cumle bitmeden bu araliklarla o ana kadarki metin gosterilir.
  # 0 = kapali. Algilanan gecikmenin buyuk kismi bu bekleme suresidir.
  partial_every_ms: 600
  # Ara altyazida cozulen ses penceresi. Uzun cumlede tum tamponu bastan cozmek
  # CPU'yu sisiriyordu; sadece son N saniye cozulur (tam cumle sonda zaten gelir).
  partial_window_s: 4.0

translate:
  engine: local         # local | deepl | none
  # Olculdu: beam 1 -> 4 gercek hatalari duzeltiyor ("scope" artik "durbun"
  # degil "kapsam"), maliyeti cumle basina ~25 ms. beam 8 belirgin fark yapmadi.
  beam_size: 4
  partial_beam_size: 1  # ara altyazida hiz onemli, greedy kalir
  # Toplanti deyimleri cevirmeden once sade Ingilizce'ye cevrilir; yoksa
  # "circle back" -> "tekrar cember cizecegim" gibi sacma ceviriler cikiyor.
  # Hazir liste (~70 kalip): src/phrases.py
  simplify_idioms: true

  # KENDI TERIMLERIN (Ingilizce -> sade Ingilizce). Ceviriden ONCE uygulanir,
  # ekranda gordugun Ingilizce metni DEGISTIRMEZ. Buyuk/kucuk harf farketmez.
  # Kullan: bir kalip sacma cevriliyorsa, sol tarafa kalibi, sag tarafa
  # "modelin anlayacagi sade Ingilizce"yi yaz.
  # Girinti 2 bosluk, her satirda "kalip: karsilik" ve ikisi de tirnak icinde:
  #
  # phrase_map:
  #   "our deck": "our slides"
  #   "the org": "the Salesforce environment"
  #   "go-live": "production release date"
  #   "UAT": "user acceptance testing"
  #   "SIT": "system integration testing"
  #
  # Asagidaki her karsilik 24.09'da tek tek denendi; soldaki Ingilizce bozuk,
  # sagdaki dogru Turkce veriyordu (ornek: "underwriting" -> "alt yazarlik",
  # "credit evaluation" -> "kredi degerlendirmesi").
  phrase_map:
    # --- MCA / finansman ---
    "underwriting": "credit evaluation"
    "underwriter": "credit analyst"
    "underwriters": "credit analysts"
    "underwrite": "evaluate the credit of"
    "merchant cash advance": "MCA loan"
    "merchant cash advances": "MCA loans"
    "merchant": "business owner"
    "merchants": "business owners"
    "term sheet": "offer summary"
    "term sheets": "offer summaries"
    "miss payment": "missed payment"
    "miss payments": "missed payments"
    "makeup payment": "payment to make up for a missed payment"
    "make up payment": "payment to make up for a missed payment"
    "make-up payment": "payment to make up for a missed payment"
    "payback amount": "total repayment amount"
    "payback": "total repayment"
    "remittance": "payment amount"
    "voided check": "cancelled check"
    "void check": "cancelled check"
    "average daily balance": "average daily account balance"
    "monthly breakdown": "monthly summary"
    "breakdown": "detailed summary"
    "background check": "background investigation"
    "affordability": "repayment capacity"
    "collections": "payment collection"
    "collection": "payment collection"
    "origination fee": "loan processing fee"
    "funders": "financing companies"
    "funder": "financing company"
    "deal intake": "receiving the application"
    "holdback": "Holdback"
    "stacking": "taking multiple loans at the same time"
    "push the deal": "send the deal"
    "pushed the deal": "sent the deal"
    "push it to": "send it to"
    # Whisper IFO'yu "iPhone" duyuyor (24.09'da 6+ kez); sadece bu kaliplar duzeltilir
    "iphone side": "IFO side"
    "like an iphone": "like an IFO"
    # --- Salesforce ---
    "sandbox": "Sandbox"
    "sandboxes": "Sandboxes"
    "full sandbox": "Full Sandbox"
    "scratch org": "Scratch Org"
    "salesforce org": "Salesforce org"
    "salesforce orgs": "Salesforce orgs"
    "org": "Salesforce org"
    "orgs": "Salesforce orgs"
    "governor limits": "Salesforce platform limits"
    "governor limit": "Salesforce platform limit"
    "picklist": "Picklist"
    "apex trigger": "Apex Trigger"
    "the trigger": "the Apex Trigger"
    "fires on update": "runs when a record is updated"
    "runs on update": "runs when a record is updated"
    "fires on insert": "runs after insert"
    "apex triggers": "Apex Triggers"
    "record-triggered flow": "Record-Triggered Flow"
    "change set": "Change Set"
    "change sets": "Change Sets"
    "lead record": "Lead record"
    "convert the lead": "convert the Lead record"
    "closed won": "Closed Won"
    "closed lost": "Closed Lost"
    "named credential": "Named Credential configuration"
    "named credentials": "Named Credential configurations"
    "create a case": "create a customer support request"
    "open a case": "open a customer support request"
    "not rendering": "not displayed"
    # --- Yazilim / bulut ---
    "bug": "software error"
    "bugs": "software errors"
    "bug fix": "error fix"
    "hotfix": "urgent fix"
    "backlog": "Backlog"
    "endpoint": "API address"
    "endpoints": "API addresses"
    "callout": "API call"
    "callouts": "API calls"
    "payload": "request data"
    "data migration": "data transfer"
    "field mapping": "field matching"
    "mapping": "matching"
    "jira ticket": "Jira task"
    "jira tickets": "Jira tasks"
    "not firing": "not triggering"
    "pull request": "Pull Request"
    "the environment": "the system environment"
    "in production": "in the live environment"
    "to production": "to the live environment"
    "in prod": "in the live environment"
    "to prod": "to the live environment"
    "live run": "live test"
    "sign off": "give approval"
    "edit access": "editing permission"
    # --- Toplanti konusmasi ---
    "you're muted": "your microphone is off"
    "you are muted": "your microphone is off"
    "you're on mute": "your microphone is off"
    "off the bat": "from the start"
    "hit this": "click this"
    "hit the button": "click the button"

  # TURKCE CIKTI ROTUSU (Turkce -> Turkce). En son uygulanir; bir terimi
  # Ingilizce birakmak ya da tercih ettigin kelimeyi kullanmak icin.
  # DIKKAT: buyuk/kucuk harf AYNEN eslesmeli, iki bicimi de yaz:
  #
  # post_map:
  #   "Yazilim surumu": "Deployment"
  #   "yazilim surumu": "deployment"
  #   "cekme istegi": "PR"
  #
  # Modelin Ingilizce girdiyle duzeltilemeyen ciktilari (olculdu 24.09).
  post_map:
    "jeton": "token"
    "Jeton": "Token"
    "boru hattı": "pipeline"
    "Boru hattı": "Pipeline"
    "Kapalı Won": "Closed Won"
    "Kapalı Kayıp": "Closed Lost"
    "Sahneleme": "Staging"
    "sahneleme": "staging"
  model_dir: models/opus-mt-en-tr-ct2
  source_prefix: ""     # cok hedefli modeller icin ornegin ">>tur<<"
  deepl_api_key: ""     # engine: deepl secilirse doldurulur (opsiyonel, ucretsiz kota)

ui:
  # Asagidaki ayarlar uygulama icindeki dis simgesinden (sag ust) canli
  # degistirilebilir ve "Kaydet" ile buraya geri yazilir.
  mode: bilingual   # bilingual (EN+TR) | tr_only | en_only
  show_partial: true   # kesinlesmemis ara altyaziyi soluk renkte goster
  # Ara altyazi cevrilsin mi? Varsayilan false: canli satir Ingilizce akar ve
  # yalnizca UZAR (kararli onek); Turkce cumle bitince bir kez basilir. true
  # yapilirsa her guncellemede Turkce bastan kurulur, okumak cok zorlasir
  # (olculdu: 7 guncellemede 7 kez tamamen degisti).
  partial_translate: false
  max_lines: 2   # ekranda gosterilen replik sayisi (pencere yuksekligini belirler)
  auto_height: false   # false ise yukseklik asagidaki 'height' degerinde sabit kalir
  max_height_ratio: 0.7 # pencere en fazla ekran yuksekliginin bu karina cikar
  opacity: 0.85
  font_size_tr: 22
  font_size_en: 12
  color_tr: "#ffffff"   # Turkce satir rengi
  color_en: "#8b98a5"   # Ingilizce satir rengi
  color_bg: "#0f1216"   # arka plan
  width: 1100
  height: 290
  margin_bottom: 80     # ekranin altindan bosluk (px)

log:
  dir: logs
  # Kac gun once biten oturumlar silinsin? 0 = hicbir sey silinmez (varsayilan).
  # Transkriptler toplanti icerigi oldugu icin otomatik silme bilerek kapali.
  keep_days: 0
